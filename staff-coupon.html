<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registra Coupon | SABINA</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0D0D0D;
            --bg-light: #1A1A1A;
            --text-main: #F5F5F5;
            --text-muted: #A3A3A3;
            --accent-red: #D99B9B;
            --accent-green: #9BC9A3;
            --border-white: rgba(255, 255, 255, 0.14);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .card {
            width: 100%;
            max-width: 420px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
        }

        .panel {
            border: 1px solid var(--border-white);
            background-color: var(--bg-light);
            padding: 28px 24px;
        }

        label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-white);
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 20px;
            font-family: 'Montserrat', sans-serif;
        }

        input#codeInput { text-transform: uppercase; letter-spacing: 2px; }

        button {
            width: 100%;
            background-color: var(--accent-red);
            color: #1A1010;
            border: none;
            padding: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .feedback {
            margin-top: 20px;
            padding: 16px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .feedback.ok { display: block; background: rgba(155, 201, 163, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .feedback.warn { display: block; background: rgba(217, 155, 155, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }

        .pin-screen { text-align: center; }
        .pin-screen input { text-align: center; letter-spacing: 6px; font-size: 1.3rem; }

        .config-warning {
            margin-top: 20px;
            padding: 14px;
            font-size: 0.8rem;
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            background: rgba(217, 155, 155, 0.1);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Registra Coupon</h1>

        <div class="panel" id="pinPanel">
            <div class="pin-screen">
                <label for="pinInput">PIN cassa</label>
                <input type="password" id="pinInput" inputmode="numeric" maxlength="8" autocomplete="off">
                <button onclick="checkPin()">Entra</button>
                <div class="feedback warn" id="pinError">PIN errato.</div>
            </div>
        </div>

        <div class="panel" id="formPanel" style="display:none;">
            <label for="codeInput">Codice mostrato dal cliente</label>
            <input type="text" id="codeInput" placeholder="ES: X27UMM" autocomplete="off">

            <label for="storeSelect">Negozio</label>
            <select id="storeSelect">
                <option value="" disabled selected>Seleziona il negozio</option>
                <option value="Frosinone">Frosinone</option>
                <option value="Alatri">Alatri</option>
                <option value="Veroli">Veroli</option>
            </select>

            <label for="amountInput">Importo scontrino (facoltativo)</label>
            <input type="number" id="amountInput" step="0.01" min="0" placeholder="ES: 49.90">

            <button id="submitBtn" onclick="submitCoupon()">Registra Utilizzo</button>

            <div class="feedback" id="resultBox"></div>
        </div>
    </div>

    <script>
        // === CONFIGURAZIONE — Fabio deve completare questi due valori ===
        const API_URL = 'INSERISCI_QUI_URL_SCRIPT_GOOGLE'; // es: https://script.google.com/macros/s/XXXXX/exec
        const STAFF_PIN = '2026'; // cambia questo PIN quando vuoi

        function checkPin() {
            const val = document.getElementById('pinInput').value;
            if (val === STAFF_PIN) {
                document.getElementById('pinPanel').style.display = 'none';
                document.getElementById('formPanel').style.display = 'block';
            } else {
                document.getElementById('pinError').style.display = 'block';
            }
        }

        document.getElementById('pinInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkPin();
        });

        document.getElementById('codeInput').addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
        });

        async function submitCoupon() {
            const code = document.getElementById('codeInput').value.trim();
            const store = document.getElementById('storeSelect').value;
            const amount = document.getElementById('amountInput').value;
            const resultBox = document.getElementById('resultBox');
            const submitBtn = document.getElementById('submitBtn');

            resultBox.className = 'feedback';
            resultBox.removeAttribute('style');

            if (!code || !store) {
                resultBox.className = 'feedback warn';
                resultBox.textContent = 'Inserisci codice e negozio.';
                return;
            }

            if (API_URL.indexOf('INSERISCI_QUI') !== -1) {
                resultBox.className = 'feedback warn';
                resultBox.innerHTML = 'Backend non ancora configurato: manca l\'URL dello script Google in questa pagina.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Verifica in corso…';

            try {
                const url = `${API_URL}?action=redeem&code=${encodeURIComponent(code)}&store=${encodeURIComponent(store)}&amount=${encodeURIComponent(amount || '')}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.ok) {
                    resultBox.className = 'feedback ok';
                    resultBox.textContent = `Coupon registrato — ${store}`;
                    document.getElementById('codeInput').value = '';
                    document.getElementById('amountInput').value = '';
                } else if (data.reason === 'duplicate') {
                    resultBox.className = 'feedback warn';
                    resultBox.textContent = 'Questo codice è già stato usato in precedenza.';
                } else {
                    resultBox.className = 'feedback warn';
                    resultBox.textContent = 'Dati mancanti o non validi.';
                }
            } catch (err) {
                resultBox.className = 'feedback warn';
                resultBox.textContent = 'Errore di connessione. Riprova.';
            }

            submitBtn.disabled = false;
            submitBtn.textContent = 'Registra Utilizzo';
        }
    </script>
</body>
</html>
